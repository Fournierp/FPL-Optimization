[project]
name = "fpl-optimization"
version = "0.0.1"
description = "fpl-optimization"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "highlight-text>=0.2",
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "sasoptpy>=1.0.5",
    "streamlit>=1.51.0",
]

[dependency-groups]
dev = [
    "coverage>=7.6.12",
    "pre-commit>=4.0.1",
    "pytest>=8.3.4",
]

[tool.ruff]
fix = true
line-length = 120
lint.ignore = ["COM812", "D100", "D101", "D102", "D103", "D107", "D400", "D415", "NPY002", "T201"]
lint.select = ["ALL"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
